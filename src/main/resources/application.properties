spring.application.name=game
server.address=0.0.0.0
spring.datasource.url=jdbc:postgresql://localhost:5432/game_db
spring.datasource.username=postgres
spring.datasource.password=secretpassword

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0

# --- Admin panel ---
# Comma-separated player ids that are granted the ADMIN role automatically
# (env var ADMIN_PLAYER_IDS also works)
game.admin.player-ids=${ADMIN_PLAYER_IDS:}
# Secret code for the one-time bootstrap promotion (env var ADMIN_BOOTSTRAP_CODE also works)
game.admin.bootstrap-code=${ADMIN_BOOTSTRAP_CODE:let-me-in}

# --- CORS ---
# Разрешённые источники для браузера (comma-separated).
# Класс-ваттер здесь — любой источник (и http, и https, любой домен —
# удобно для туннелей вроде cloudflared/ngrok с произвольным адресом).
# Для ужесточения перечислите конкретные origins:
#   game.cors.allowed-origins=http://localhost:8080,http://localhost:3000,https://game.example.com
# (env var GAME_CORS_ALLOWED_ORIGINS also works)
game.cors.allowed-origins=${GAME_CORS_ALLOWED_ORIGINS:*}

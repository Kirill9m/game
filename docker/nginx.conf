# Единая точка входа: один порт для всего стека.
#   /api/v1, /api/admin, /v3/api-docs, /swagger-ui -> Spring Boot (backend:8080)
#   /api/auth (next-auth), страницы, статика          -> Next.js (client:3000)
#   PostgreSQL наружу не публикуется вовсе.

upstream game_backend {
    server backend:8080;
}
upstream game_client {
    server client:3000;
}

# Определяем, по какому протоколу клиент реально обратился к туннелю.
# Туннели (cloudflared / ngrok) достукиваются до nginx по HTTP
# и сообщают исходный протокол заголовками X-Forwarded-Proto
# (ngrok) или Cf-Visitor (cloudflared).
map "$http_x_forwarded_proto|$http_cf_visitor" $forwarded_proto {
    default $scheme;
    "~^https"                          https;
    "~^http"                           http;
    "~\"scheme\":\"https\""            https;
    "~\"scheme\":\"http\""             http;
}

map $forwarded_proto $forwarded_ssl {
    default off;
    https   on;
}

server {
    listen 80;
    server_name _;

    client_max_body_size 10m;

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $forwarded_proto;
    proxy_set_header X-Forwarded-Ssl $forwarded_ssl;

    # next-auth обрабатывается самим Next.js, поэтому его маршрутизируем на клиент
    # (длиннее, чем /api/, поэтому nginx выберет этот location)
    location /api/auth {
        proxy_pass http://game_client;
    }

    # API игры -> Spring Boot
    location /api/ {
        proxy_pass http://game_backend;
    }

    # Swagger / OpenAPI -> Spring Boot
    location /swagger-ui {
        proxy_pass http://game_backend;
    }
    location /v3/api-docs {
        proxy_pass http://game_backend;
    }

    # Всё остальное (страницы, _next, и т.д.) -> Next.js
    location / {
        proxy_pass http://game_client;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
# Одна система на один порт:
#   postgres (база)  -> только внутри сети compose, наружу НЕ пробрасывается
#   backend (Spring) -> внутри сети, наружу НЕ пробрасывается
#   client  (Next.js)-> внутри сети, наружу НЕ пробрасывается
#   nginx            -> единая точка входа: публикует ОДИН порт (APP_PORT, по умолчанию 8080)
#
# Тунель (cloudflared / ngrok и т.п.) наводится на этот единственный порт.

services:
  postgres:
    image: postgres:18-alpine
    container_name: game_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-secretpassword}
      POSTGRES_DB: ${POSTGRES_DB:-game_db}
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-game_db}"]
      interval: 5s
      timeout: 5s
      retries: 12

  backend:
    build:
      context: .
      dockerfile: docker/backend.Dockerfile
    container_name: game_backend
    restart: unless-stopped
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-game_db}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-postgres}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-secretpassword}
      ADMIN_PLAYER_IDS: ${ADMIN_PLAYER_IDS:-}
      ADMIN_BOOTSTRAP_CODE: ${ADMIN_BOOTSTRAP_CODE:-let-me-in}
      # Разрешённые CORS-источники (comma-separated). По умолчанию "*"
      # разрешает любой origin (http/https, любой домен) — удобно для туннелей.
      # Для ужесточения перечислите конкретные, например:
      #   https://game.example.com,http://localhost:8080,http://localhost:3000
      GAME_CORS_ALLOWED_ORIGINS: ${GAME_CORS_ALLOWED_ORIGINS:-*}
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/8080"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  client:
    build:
      context: ./game-client
    container_name: game_client
    restart: unless-stopped
    environment:
      # Публичный адрес (для GitHub OAuth). После настройки тунеля впишите адрес тунеля сюда.
      NEXTAUTH_URL: ${NEXTAUTH_URL:-http://localhost:8080}
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET:-please-change-me}
      GITHUB_ID: ${GITHUB_ID:-}
      GITHUB_SECRET: ${GITHUB_SECRET:-}
      # Куда Next.js проксирует /api/v1 (см. next.config.ts)
      BACKEND_URL: http://backend:8080
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 15s

  nginx:
    image: nginx:alpine
    container_name: game_nginx
    restart: unless-stopped
    ports:
      - "${APP_PORT:-8080}:80"
    volumes:
      - ./docker/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend
      - client

volumes:
  pgdata: